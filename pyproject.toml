[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iput-memerr"
version = "0.0.3"
description = "Asymmetric uncertainty estimates for memory consumption measurements of virtual machines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Oleg D. Kazakov", email = "kazakov@bgitu.ru" },
]
maintainers = [
  { name = "Oleg D. Kazakov", email = "kazakov@bgitu.ru" },
]
keywords = ["uncertainty", "error propagation", "memory", "virtual machine", "KVM", "asymmetric error", "GUM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/89605502155/iput-memerr"
Repository = "https://github.com/89605502155/iput-memerr"
Demo = "https://github.com/89605502155/iput-memerr-demo"
Changelog = "https://github.com/89605502155/iput-memerr/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/iput_memerr"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
